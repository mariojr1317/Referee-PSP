name: Build PSP ISO & Package

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Compilar Juego PSP
        run: |
          make

      - name: Crear ISO y Paquete ZIP
        run: |
          # 1. Detectar e instalar herramientas de empaquetado (genisoimage y zip)
          if command -v apk >/dev/null 2>&1; then
            apk update && (apk add genisoimage zip || apk add cdrkit zip || apk add xorriso zip)
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y genisoimage zip
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm cdrtools zip
          fi

          # 2. Crear Paquete ZIP para tarjeta de memoria (ms0:/PSP/GAME/ArbitroPSP/)
          mkdir -p ArbitroPSP
          cp EBOOT.PBP ArbitroPSP/ 2>/dev/null || true
          cp -r assets ArbitroPSP/ 2>/dev/null || true
          zip -r ArbitroPSP_Bundle.zip ArbitroPSP

          # 3. Crear Estructura de Disco para la ISO de PSP (UMD)
          mkdir -p iso_structure/PSP_GAME/SYSDIR
          mkdir -p iso_structure/PSP_GAME/USRDIR

          # Copiar ejecutable, metadatos y assets dentro del árbol de la ISO
          cp EBOOT.PBP iso_structure/PSP_GAME/SYSDIR/EBOOT.BIN 2>/dev/null || true
          cp PARAM.SFO iso_structure/PSP_GAME/ 2>/dev/null || true
          cp -r assets iso_structure/PSP_GAME/USRDIR/ 2>/dev/null || true

          # 4. Generar la imagen .ISO de PSP
          if command -v genisoimage >/dev/null 2>&1; then
            genisoimage -o ArbitroPSP.iso -pad -r -J -V "ARBITRO_PSP" iso_structure
          elif command -v mkisofs >/dev/null 2>&1; then
            mkisofs -o ArbitroPSP.iso -pad -r -J -V "ARBITRO_PSP" iso_structure
          elif command -v xorriso >/dev/null 2>&1; then
            xorriso -as genisoimage -o ArbitroPSP.iso -pad -r -J -V "ARBITRO_PSP" iso_structure
          fi

      - name: Subir Archivos Generados (ISO y ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: ArbitroPSP-Build
          path: |
            ArbitroPSP.iso
            ArbitroPSP_Bundle.zip
